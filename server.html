

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eaglercraft Clients</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
            top: 0;
            left: 0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --item-bg: rgba(255, 255, 255, 0.1);
            --item-hover: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            background: radial-gradient(circle at top right, #232440, #1a1b2d);
            color: #fff;
            min-height: 100vh;
            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            color: #fff;
            text-shadow: 0 0 25px rgba(243, 168, 71, 0.5);
            letter-spacing: 2px;
            font-weight: 700;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 2rem;
            position: relative;
        }

        .search-container input {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            transition: all 0.3s ease;
        }

        .search-container input:focus {
            outline: none;
            border-color: #f3a847;
            box-shadow: 0 0 15px rgba(243, 168, 71, 0.2);
        }

        .category {
            margin-bottom: 2rem;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .category.hidden {
            display: none;
        }

        .category h2 {
            color: #f3a847;
            margin-bottom: 1rem;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .category-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.2rem;
        }

        .item {
            border-radius: 10px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .item:hover {
            transform: translateY(-6px);
            background: var(--item-hover);
            border-color: #e48f34;
            box-shadow: 
                0 4px 25px rgba(0, 0, 0, 0.15),
                0 0 20px rgba(243, 168, 71, 0.2);
        }

        .item a {
            text-decoration: none;
            color: #fff;
            font-size: 1rem;
            display: block;
            padding: 1.2rem 1.7rem;
            position: relative;
            z-index: 1;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .item:hover a {
            color: #f3a847;
        }

        .version {
            font-size: 0.9rem;
            opacity: 0.8;
            display: block;
            margin-top: 0.25rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1.5rem 1rem;
            }

            h1 {
                font-size: 2.1rem;
            }

            .category-container {
                category-container-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        .no-results {
            text-align: center;
            padding: 2rem;
            color: rgba(255, 255, 255, 0.7);
            display: none;
        }
        
        .servers-btn {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            transition: all 0.3s ease;
            margin-top: 1rem;
            font-weight: 600;
        }

        .servers-btn:hover {
            background: var(--item-hover);
            border-color: #e48f34;
            box-shadow: 
                0 4px 25px rgba(0, 0, 0, 0.15),
                0 0 20px rgba(243, 168, 71, 0.2);
        }
        
        #visitorCount {
          display: block;
          margin-left: auto;
          margin-right: auto;
        }
    </style>
